<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MailMind</title>
  <link rel="stylesheet" href="../common.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1><img src="../../icons/icon.svg" alt="" width="18" height="18"> MailMind · writing help</h1>
  <div class="grid">
    <button data-op="improve">✨ Improve</button>
    <button data-op="grammar">🔤 Fix grammar</button>
    <button data-op="shorten">✂ Shorten</button>
    <button data-op="expand">📝 Notes → email</button>
    <button data-op="formal">👔 More formal</button>
    <button data-op="friendly">😊 Friendlier</button>
  </div>
  <div class="subtle">Or tell it what to do</div>
  <div class="row">
    <input id="custom" type="text" style="flex:1" placeholder="e.g. Translate to Spanish / Add a polite deadline of Friday">
    <button id="btn-custom">Go</button>
  </div>
  <div class="row" style="margin-top:8px">
    <button id="btn-review">🔍 Review before sending</button>
    <button id="btn-subject">Suggest subject</button>
  </div>
  <div id="out"></div>
  <div id="outActions" class="actions row hidden">
    <button id="btn-replace" class="primary">Replace my text</button>
    <button id="btn-insert">Insert above</button>
    <button id="btn-use-subject" class="primary hidden">Use subject</button>
    <button id="btn-copy">Copy</button>
    <button id="btn-stop" class="hidden">Stop</button>
  </div>
  <div class="small muted" style="margin-top:8px">Your signature and the quoted email are kept as they are.</div>
  <script src="compose.js"></script>
</body>
</html>
