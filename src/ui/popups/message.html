<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MailMind</title>
  <link rel="stylesheet" href="../common.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1><img src="../../icons/icon.svg" alt="" width="18" height="18"> MailMind <span id="subject" class="muted small"></span></h1>
  <div class="grid">
    <button data-q="summarize">📝 Summarise</button>
    <button data-q="actions">✅ Action items</button>
    <button data-q="junk">🛡 Is this junk / phishing?</button>
    <button data-q="explain">💡 Explain</button>
    <button id="btn-thread">🧵 Summarise conversation</button>
    <button id="btn-events">📅 Dates &amp; tasks</button>
  </div>
  <div class="subtle">Draft a reply — what should it say? (optional)</div>
  <textarea id="replyHint" rows="2" placeholder="e.g. Thanks, Thursday works, I'll bring the documents"></textarea>
  <div class="row">
    <button id="btn-reply" class="primary">✍ Draft reply</button>
    <label class="row small"><input type="checkbox" id="replyAll"> Reply all</label>
    <span class="spacer"></span>
    <button id="btn-ask" title="Open the chat with this email attached">💬 Ask in chat</button>
  </div>
  <div id="out" class="md"></div>
  <div id="events" class="hidden"></div>
  <div id="outActions" class="actions row hidden">
    <button id="btn-open-reply" class="primary">Open reply</button>
    <button id="btn-copy">Copy</button>
    <button id="btn-stop" class="hidden">Stop</button>
  </div>
  <script src="message.js"></script>
</body>
</html>
